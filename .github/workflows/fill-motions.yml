name: Fill missing guest motions

# 정면만 있고 동작 이미지(걷기·점프 등)가 AI 오류로 빠진 하객을 찾아 마저 만든다 (scripts/fill-motions.mjs)
# GitHub 스케줄은 몇 시간씩 밀리거나 빠지기 일쑤라(이 저장소에선 15분마다로 해도 반나절에 1번) 믿지 않고,
# 방명록 글이 올라오거나 바뀔 때마다 돈다. 스케줄은 혼잡한 정각을 피한 보조용
on:
  discussion:
    types: [created, edited]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      max_guests:
        description: '한 번에 처리할 하객 수'
        default: '5'

permissions:
  contents: write
  discussions: read
  actions: write # 재배포(deploy.yml) 실행

concurrency:
  group: fill-motions
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate missing motions
        id: gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUESTBOOK_CATEGORY: 방명록
          MAX_GUESTS: ${{ inputs.max_guests || '5' }}
        run: |
          npm install --no-save --no-package-lock puppeteer-core@23
          node scripts/fill-motions.mjs

      - name: Commit, push and redeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add img/guests
          if git diff --cached --quiet; then
            echo "새로 만든 이미지 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "누락된 하객 동작 이미지 생성"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              # img/guests만 바뀐 push는 배포를 안 부르므로 직접 (fetch-guests가 파일로 동작 URL을 채움)
              gh workflow run deploy.yml --ref main
              exit 0
            fi
            sleep 5
          done
          echo "push 실패" && exit 1

      # 남은 하객이 있으면 이어서 (concurrency로 이번 실행이 끝난 뒤 시작)
      - name: Run again for remaining guests
        if: steps.gen.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run fill-motions.yml --ref main -f max_guests="${{ inputs.max_guests || '5' }}"
